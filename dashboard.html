<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigia SISFE — Antenucci (local)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --azul: #1B3A6B; --azul2: #2E5BA8; --azul-l: #EBF1FB;
    --gris: #F4F4F2; --gris2: #E8E8E4; --gris3: #9A9A96;
    --negro: #111110; --blanco: #FAFAF8; --borde: #D8D8D4;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  body { font-family: var(--sans); background: var(--gris); color: var(--negro); min-height: 100vh; }
  header { background: var(--azul); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--azul2); flex-wrap: wrap; gap: 8px; }
  header h1 { font-family: var(--mono); font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  header h1 span { color: #7BA7E0; font-weight: 400; }
  .badge-local { font-family: var(--mono); font-size: 10.5px; background: rgba(123,167,224,.18); color: #cfe0f7; border: 1px solid rgba(123,167,224,.4); border-radius: 4px; padding: 3px 8px; }
  .estado { font-family: var(--mono); font-size: 11px; color: #7BA7E0; }
  main { max-width: 1000px; margin: 28px auto; padding: 0 20px; }
  .resumen { display: flex; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .card { background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 14px 18px; flex: 1; min-width: 160px; }
  .card .num { font-family: var(--mono); font-size: 24px; font-weight: 600; color: var(--azul); }
  .card .label { font-size: 11px; color: var(--gris3); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
  .search-box { width: 100%; border: 1px solid var(--borde); border-radius: 6px; padding: 9px 12px; font-family: var(--sans); font-size: 13px; background: #fff; outline: none; margin-bottom: 14px; }
  .search-box:focus { border-color: var(--azul2); }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 14px; font-size: 12.5px; border-bottom: 1px solid var(--gris2); vertical-align: top; }
  th { background: var(--gris); color: var(--gris3); text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--azul-l); }
  .expediente { font-family: var(--mono); font-size: 11.5px; }
  .expediente a { color: var(--azul2); text-decoration: none; }
  .expediente a:hover { text-decoration: underline; }
  .vacio { text-align: center; padding: 40px 20px; color: var(--gris3); }
  .error { background: #FDECEA; color: #C0392B; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
  .privacidad { font-size: 11px; color: var(--gris3); margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>ANTENUCCI <span>/ vigia sisfe</span></h1>
  <span class="badge-local">🔒 SOLO EN ESTA PC — NO PUBLICADO</span>
  <div class="estado" id="estado">cargando…</div>
</header>
<main>
  <div id="error-box"></div>
  <div class="resumen" id="resumen"></div>
  <input class="search-box" id="buscador" type="text" placeholder="Filtrar por carátula, expediente o radicación...">
  <table id="tabla">
    <thead>
      <tr><th>Expediente</th><th>Carátula</th><th>Fecha inicio</th><th>Última actualización</th><th>Radicación actual</th></tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="privacidad">Estos datos nunca salen de tu PC: se sirven desde un servidor local (127.0.0.1), no hay publicación a internet.</div>
</main>
<script>
let causasGlobal = [];

function render(causas) {
  const tbody = document.getElementById('tbody');
  if (!causas.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="vacio">Sin resultados.</td></tr>';
    return;
  }
  tbody.innerHTML = causas
    .map(c => `
      <tr>
        <td class="expediente">${c.url ? `<a href="${c.url}" target="_blank">${c.expediente}</a>` : c.expediente}</td>
        <td>${c.caratula}</td>
        <td>${c.fecha_inicio}</td>
        <td>${c.ultima_actualizacion}</td>
        <td>${c.radicacion}</td>
      </tr>
    `).join('');
}

async function cargar() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    const data = await res.json();
    causasGlobal = (data.causas || []).slice()
      .sort((a, b) => (b.ultima_actualizacion || '').localeCompare(a.ultima_actualizacion || ''));

    document.getElementById('estado').textContent = data.actualizado
      ? 'última corrida: ' + new Date(data.actualizado).toLocaleString('es-AR')
      : 'todavía sin corridas';

    document.getElementById('resumen').innerHTML = `
      <div class="card"><div class="num">${causasGlobal.length}</div><div class="label">Causas vinculadas</div></div>
    `;

    render(causasGlobal);
  } catch (e) {
    document.getElementById('error-box').innerHTML = '<div class="error">No se pudo cargar el estado: ' + e.message + '</div>';
  }
}

document.getElementById('buscador').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  render(causasGlobal.filter(c =>
    (c.caratula || '').toLowerCase().includes(q) ||
    (c.expediente || '').toLowerCase().includes(q) ||
    (c.radicacion || '').toLowerCase().includes(q)
  ));
});

cargar();
</script>
</body>
</html>
