name: Vigia SISFE

on:
  schedule:
    # Cada 4 horas, en horario habil aproximado (UTC-3 -> UTC).
    - cron: '0 11,15,19,23 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: vigia-sisfe
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Instalar navegador (chromium)
        run: npx playwright install --with-deps chromium

      - name: Correr chequeo
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: npm run check
